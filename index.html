<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPG True Grind - The Guild (Milestone 1)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #111827;
      color: #f3f4f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
      background: #1f2937;
    }
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 12px 16px;
      max-width: 320px;
    }
    .hud-title {
      font-size: 14px;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .hud-stat {
      font-size: 14px;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }
    .hud-stat-value {
      font-weight: 600;
      color: #60a5fa;
    }
    #unlock-modal {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(17, 24, 39, 0.95);
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: auto;
    }
    #unlock-modal.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    #unlock-modal h2 {
      color: #f59e0b;
      font-size: 24px;
      margin-bottom: 8px;
    }
    #unlock-modal p {
      color: #d1d5db;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud-overlay">
      <div class="hud-card">
        <div class="hud-title">Guild Hero</div>
        <div class="hud-stat">
          <span>HP:</span>
          <span id="player-hp-text" class="hud-stat-value">50 / 50</span>
        </div>
        <div class="hud-stat">
          <span>Equipped Weapon:</span>
          <span id="equipped-weapon-text" class="hud-stat-value">Short Swords</span>
        </div>
        <div class="hud-stat">
          <span>Short Swords Prof:</span>
          <span id="proficiency-text" class="hud-stat-value">0 / 10 (Novice)</span>
        </div>
      </div>

      <div id="unlock-modal">
        <h2>✨ CLASS UNLOCKED! ✨</h2>
        <p><strong id="unlocked-class-name" style="color: #60a5fa;">Fencer</strong></p>
        <p id="unlocked-class-fantasy" style="font-size: 13px; color: #9ca3af; margin-top: 4px;">Quick, light-footed duelist</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
